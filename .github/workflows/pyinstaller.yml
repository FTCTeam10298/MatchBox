on:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pyinstaller-build-mac:
    runs-on: macos-latest
    steps:
      - name: Create Executable
        uses: unofficial-rev-port/pyinstaller@v1.2
        env:
          ARCHFLAGS: "-arch arm64 -arch x86_64"
          MATCHBOX_TARGET_ARCH: universal2
        with:
          python_ver: '3.12'
          pyinstaller_ver: '==6.22.3'
          spec: 'matchbox.spec'
          requirements: 'pyinstaller-build-reqs.txt'
          clean_checkout: false
      - name: Report non-universal2 binaries
        if: always()
        shell: bash
        run: |
          SP=/Library/Frameworks/Python.framework/Versions/3.12/lib/python3.12/site-packages
          echo "Scanning $SP and bundled tool binaries for non-universal2 Mach-O files..."
          bad=0
          while IFS= read -r f; do
            archs=$(lipo -archs "$f" 2>/dev/null) || continue
            [ -z "$archs" ] && continue
            case "$archs" in
              "x86_64 arm64"|"arm64 x86_64") ;;
              *) echo "THIN ($archs): $f"; bad=1 ;;
            esac
          done < <(find "$SP" build/ffmpeg-binaries \( -name '*.so' -o -name '*.dylib' -o -name 'ffmpeg' -o -name 'ffprobe' \) -type f 2>/dev/null)
          echo
          echo "Offending packages (top-level dirs in site-packages):"
          find "$SP" \( -name '*.so' -o -name '*.dylib' \) -type f 2>/dev/null | while IFS= read -r f; do
            archs=$(lipo -archs "$f" 2>/dev/null) || continue
            case "$archs" in "x86_64 arm64"|"arm64 x86_64"|"") ;; *) echo "${f#$SP/}" | cut -d/ -f1 ;; esac
          done | sort -u
          exit 0
      - name: Make DMG
        uses: unofficial-rev-port/create-dmg-action-fixed-icon@v1
        with:
          name: 'MatchBox'
          srcdir: './dist/MatchBox.app'
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: 'MatchBox_macOS'
          path: './MatchBox.dmg'
  pyinstaller-build-win:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        uses: unofficial-rev-port/pyinstaller@v1.2
        with:
          python_ver: '3.12'
          pyinstaller_ver: '==6.22.3'
          spec: 'matchbox.spec'
          requirements: 'pyinstaller-build-reqs.txt'
          clean_checkout: false
          upload_exe_with_name: 'MatchBox_Windows'
  pyinstaller-build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Create Executable
        uses: unofficial-rev-port/pyinstaller@v1.2
        with:
          python_ver: '3.12'
          pyinstaller_ver: '==6.22.3'
          spec: 'matchbox.spec'
          requirements: 'pyinstaller-build-reqs.txt'
          clean_checkout: false
          upload_exe_with_name: 'MatchBox_Linux'
      - name: Upload version file for testing
        uses: actions/upload-artifact@v7
        with:
          name: 'version'
          path: './_version.py'
